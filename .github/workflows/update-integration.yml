name: update-integration

# Linux integration for the panel update from stable d587d590518d to this branch.
# Does not deploy, does not publish a GitHub Release, and does not touch production VPS.
# Temporary push trigger is limited to this test branch because workflow_dispatch
# is unavailable until the workflow exists on the default branch. Do not widen it.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/configurations-premium-glass
    paths:
      - ".github/workflows/update-integration.yml"
      - "scripts/update-integration.test.sh"
      - "scripts/seed-stable-panel.mjs"
      - "panel/**"
      - "agent/**"
      - "installer/**"
      - "lib/**"
      - "app/**"
      - "components/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: update-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: agent/go.mod

      - name: Install npm dependencies
        run: npm ci

      - name: Install age for backup tests
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          age --version
          age-keygen --version

      - name: Unit gates without root
        run: |
          set -euo pipefail
          (cd agent && go test ./...)
          npm test
          npx tsc --noEmit
          npm run lint
          npm run build
          unset FAMILY_VPN_PUBLIC_URL || true
          bash scripts/build-release.sh
          (cd releases && sha256sum -c SHA256SUMS)
          chmod +x releases/family-vpn-agent-linux-amd64
          test "$(releases/family-vpn-agent-linux-amd64 --version)" = "0.4.1"
          bash scripts/verify-production-ready.sh

      - name: Prove Docker Compose is available on the runner
        run: |
          docker version
          docker compose version
          echo "RUNNER_DOCKER_OK"

      - name: Run the Docker update integration as root
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "FAMILY_VPN_STABLE_COMMIT=d587d590518d" \
            "FAMILY_VPN_NEW_COMMIT=HEAD" \
            "FAMILY_VPN_INTEGRATION_REPORT=$GITHUB_WORKSPACE/dist/update-integration-report.txt" \
            bash "$GITHUB_WORKSPACE/scripts/update-integration.test.sh"

      - name: Upload private test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-integration-${{ github.run_id }}
          path: |
            dist/update-integration-report.txt
            releases/SHA256SUMS
            releases/INSTALL.txt
            releases/family-vpn-agent-linux-amd64
            releases/install.sh
          if-no-files-found: warn
          retention-days: 14
