name: agent-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "installer/**"
      - "scripts/build-release.sh"
      - "scripts/fetch-agent-release.ps1"
      - ".github/workflows/agent-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: agent/go.mod

      - name: Go tests
        working-directory: agent
        run: go test ./...

      - name: Installer shell checks
        run: |
          bash -n installer/install.sh
          bash installer/preserve-wg.test.sh
          bash installer/update-mode.test.sh

      - name: Build release artifacts
        env:
          FAMILY_VPN_PUBLIC_URL: http://127.0.0.1:13010
          VERSION: "0.4.0"
        run: bash scripts/build-release.sh

      - name: Verify checksums and agent version
        run: |
          (cd releases && sha256sum -c SHA256SUMS)
          chmod +x releases/family-vpn-agent-linux-amd64
          test "$(releases/family-vpn-agent-linux-amd64 version)" = "0.4.0"
          grep -F -- '--update' releases/INSTALL.txt
          cat releases/SHA256SUMS
          cat releases/INSTALL.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: family-vpn-agent-0.4.0
          path: |
            releases/family-vpn-agent-linux-amd64
            releases/install.sh
            releases/SHA256SUMS
            releases/INSTALL.txt
            releases/bootstrap.sh
          if-no-files-found: error
