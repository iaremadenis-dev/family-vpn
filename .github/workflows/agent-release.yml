name: agent-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "installer/**"
      - "scripts/build-release.sh"
      - "scripts/fetch-agent-release.ps1"
      - ".github/workflows/agent-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: agent/go.mod

      - name: Go tests (required before release build)
        working-directory: agent
        run: |
          set -euo pipefail
          go version | grep -E 'go1\.22'
          go test -count=1 ./...
          # Race detector needs cgo; keep it after the plain suite so plain failures stay clear.
          CGO_ENABLED=1 go test -count=1 -race ./...

      - name: Installer and isolation shell checks
        run: |
          bash -n installer/install.sh
          bash -n installer/install-from-panel.sh
          bash installer/preserve-wg.test.sh
          bash installer/update-mode.test.sh
          bash installer/install-from-panel.test.sh
          bash installer/client-isolation.test.sh

      - name: Require production signing secret
        env:
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FAMILY_VPN_RELEASE_SIGNING_KEY:-}" ]; then
            echo "FAMILY_VPN_RELEASE_SIGNING_KEY secret is required for production releases" >&2
            exit 1
          fi

      - name: Build Linux amd64 agent and signed release artifacts
        env:
          FAMILY_VPN_PUBLIC_URL: http://127.0.0.1:13010
          VERSION: "0.5.0"
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: bash scripts/build-release.sh

      - name: Verify checksums, version, and release signature
        run: |
          set -euo pipefail
          (cd releases && sha256sum -c SHA256SUMS)
          chmod +x releases/family-vpn-agent-linux-amd64
          test "$(releases/family-vpn-agent-linux-amd64 --version)" = "0.5.0"
          test "$(releases/family-vpn-agent-linux-amd64 version)" = "0.5.0"
          file releases/family-vpn-agent-linux-amd64 | grep -E 'ELF 64-bit|LSB executable|static'
          test -f releases/release-signing.pub
          test -f releases/install.sh.sig
          bash scripts/release-signing.test.sh
          FP=$(sha256sum releases/release-signing.pub | awk '{print $1}')
          node scripts/verify-release-file.mjs releases/install.sh releases/install.sh.sig releases/release-signing.pub "$FP"
          cp releases/install.sh /tmp/install.tampered
          echo tamper >> /tmp/install.tampered
          if node scripts/verify-release-file.mjs /tmp/install.tampered releases/install.sh.sig releases/release-signing.pub "$FP"; then
            echo "tampered install.sh was accepted" >&2
            exit 1
          fi
          grep -F 'install.sh.sig' releases/bootstrap.sh
          grep -F -- '--update' releases/INSTALL.txt
          cat releases/SHA256SUMS
          cat releases/INSTALL.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: family-vpn-agent-0.5.0
          path: releases/
          if-no-files-found: error
