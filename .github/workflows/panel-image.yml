name: panel-image

# Builds the production panel image + signed update pack inside the private repo.
# Does not deploy to DE-01 / NL-01. Artifacts are uploaded for operator download.
on:
  push:
    branches: [main]
    paths:
      - "scripts/templates/**"
      - "scripts/build-two-installers.py"
      - ".github/workflows/panel-image.yml"
  workflow_dispatch:
    inputs:
      public_url:
        description: Panel origin baked into bootstrap/update one-liners
        required: true
        default: https://62.133.60.25
      create_github_release:
        description: Create a GitHub Release with the artifacts (private repo)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      FAMILY_VPN_PUBLIC_URL: ${{ inputs.public_url || 'https://62.133.60.25' }}
      FAMILY_VPN_PREV_PANEL_DIGEST: sha256:b5a719f0148019784f4eb544289fb2acb4174cf1c8b76e70f18f73ac37b09479
      VERSION: "0.5.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: agent/go.mod

      - name: Check the installer order without Docker
        run: |
          bash -n panel/install-panel.sh
          bash -n panel/update-panel.sh
          bash -n scripts/build-image-install.sh
          bash -n scripts/build-panel-update.sh
          bash panel/install-panel.test.sh
          bash scripts/docker-bootstrap.test.sh

      - name: Require production signing secret
        env:
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FAMILY_VPN_RELEASE_SIGNING_KEY:-}" ]; then
            echo "FAMILY_VPN_RELEASE_SIGNING_KEY is missing." >&2
            echo "Add it under Settings → Secrets and variables → Actions." >&2
            echo "Value = full PKCS8 PEM of keys/release-signing.pem (BEGIN/END lines included)." >&2
            echo "Do not paste the private key into issues, PRs, or chat." >&2
            exit 1
          fi
          # Never print the secret. Only confirm non-empty length.
          python3 - <<'PY'
          import os
          key = os.environ["FAMILY_VPN_RELEASE_SIGNING_KEY"]
          assert "BEGIN" in key and "PRIVATE KEY" in key and "END" in key
          assert len(key) > 80
          print("signing secret present (contents not logged)")
          PY

      - name: Signing key hygiene
        env:
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: |
          # Materialize key only under umask-restricted temp for local verify helpers.
          umask 077
          printf '%s\n' "$FAMILY_VPN_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing.pem"
          chmod 600 "$RUNNER_TEMP/release-signing.pem"
          export FAMILY_VPN_RELEASE_SIGNING_KEY_FILE="$RUNNER_TEMP/release-signing.pem"
          unset FAMILY_VPN_RELEASE_SIGNING_KEY
          bash scripts/check-signing-key-hygiene.sh
          bash scripts/release-signing.test.sh

      - name: Build signed agent 0.5.0 release
        env:
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: |
          bash scripts/run-agent-go-tests.sh
          bash scripts/build-release.sh
          bash scripts/verify-signed-release-local.sh
          test "$(releases/family-vpn-agent-linux-amd64 --version)" = "0.5.0"

      - name: Check the image install package
        env:
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: bash scripts/build-image-install.test.sh

      - name: Build the production panel image
        run: bash scripts/build-panel-image.sh

      - name: Pack the minimal installer
        env:
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: |
          digest=$(tr -d '[:space:]' < dist/panel-image-id.txt)
          bash scripts/build-image-install.sh --digest "$digest" --image-ref "$digest"

      - name: Pack signed panel update bundle
        env:
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: |
          digest=$(tr -d '[:space:]' < dist/panel-image-id.txt)
          # Refuse packaging if we somehow rebuilt the old production digest.
          if [ "$digest" = "$FAMILY_VPN_PREV_PANEL_DIGEST" ]; then
            echo "new image digest equals previous production digest; refuse" >&2
            exit 1
          fi
          bash scripts/update-panel.test.sh
          bash scripts/build-panel-update.sh --digest "$digest" --image-ref "$digest"
          # Confirm boot/pack targets the NEW digest (not panel-d587d590518d).
          grep -F "$digest" dist/PANEL-UPDATE.txt
          archive=$(ls dist/family-vpn-panel-update-*.tar.gz | head -1)
          tar -xOf "$archive" family-vpn-panel-update/BUNDLE-INFO.txt | grep -F "image_digest=$digest"
          [ "$digest" != "$FAMILY_VPN_PREV_PANEL_DIGEST" ]

      - name: Build exactly two signed public entrypoints
        env:
          FAMILY_VPN_RELEASE_SIGNING_KEY: ${{ secrets.FAMILY_VPN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/build-two-installers.py
          (cd dist && sha256sum -c panel.sh.sha256 && sha256sum -c wireguard.sh.sha256)
          grep -F 'family-vpn-panel' dist/panel.sh
          grep -F 'family-vpn-wireguard' dist/wireguard.sh
          test -f dist/panel.sh.sig
          test -f dist/wireguard.sh.sig

      - name: Write operator summary
        run: |
          set -euo pipefail
          digest=$(tr -d '[:space:]' < dist/panel-image-id.txt)
          commit=$(tr -d '[:space:]' < dist/panel-image-commit.txt)
          short=$(git rev-parse --short=12 HEAD)
          {
            echo "NEW_PANEL_DIGEST=$digest"
            echo "SOURCE_COMMIT=$commit"
            echo "PREV_PANEL_DIGEST=$FAMILY_VPN_PREV_PANEL_DIGEST"
            echo "ROLLBACK_HINT=panel-d587d590518d"
            echo "AGENT_VERSION=0.5.0"
            echo "PUBLIC_URL=$FAMILY_VPN_PUBLIC_URL"
            echo
            echo "=== PANEL-UPDATE.txt ==="
            cat dist/PANEL-UPDATE.txt
            echo
            echo "=== two public entrypoints ==="
            cat dist/panel.sh.sha256 dist/wireguard.sh.sha256
            echo
            echo "=== agent INSTALL.txt (update command) ==="
            grep -E 'Safe one-line update|curl -fsSL|fingerprint|0\.5\.0' releases/INSTALL.txt || cat releases/INSTALL.txt
          } | tee dist/RELEASE-SUMMARY.txt
          # GitHub Job Summary (no secrets)
          {
            echo "## Family VPN production build"
            echo
            echo "- **New panel digest:** \`$digest\`"
            echo "- **Previous (rollback):** \`$FAMILY_VPN_PREV_PANEL_DIGEST\` (panel-d587d590518d)"
            echo "- **Agent:** 0.5.0"
            echo "- **Commit:** \`$short\`"
            echo
            echo "Unauthenticated download URLs work after you copy artifacts to"
            echo "\`${FAMILY_VPN_PUBLIC_URL}/releases/\` (not done by this workflow)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: family-vpn-production-release
          path: |
            dist/panel-image-id.txt
            dist/panel-image-commit.txt
            dist/family-vpn-panel-image.tar
            dist/family-vpn-panel-image.tar.sha256
            dist/family-vpn-install-*.tar.gz
            dist/family-vpn-install-*.tar.gz.sha256
            dist/family-vpn-install-*.tar.gz.sig
            dist/panel-install-boot-*.sh
            dist/panel-install-boot-*.sh.sig
            dist/IMAGE-INSTALL.txt
            dist/family-vpn-panel-update-*.tar.gz
            dist/family-vpn-panel-update-*.tar.gz.sha256
            dist/family-vpn-panel-update-*.tar.gz.sig
            dist/panel-update-boot-*.sh
            dist/PANEL-UPDATE.txt
            dist/panel.sh
            dist/panel.sh.sha256
            dist/panel.sh.sig
            dist/wireguard.sh
            dist/wireguard.sh.sha256
            dist/wireguard.sh.sig
            dist/RELEASE-SUMMARY.txt
            releases/**
          if-no-files-found: error

      - name: Create GitHub Release (private)
        if: ${{ github.event_name == 'push' || inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest=$(tr -d '[:space:]' < dist/panel-image-id.txt)
          short=$(git rev-parse --short=12 HEAD)
          tag="panel-${short}"
          # Idempotent: delete draft with same tag if re-run.
          gh release view "$tag" >/dev/null 2>&1 && gh release delete "$tag" --yes || true
          gh release create "$tag" \
            --title "Family VPN panel ${short} + agent 0.5.0" \
            --notes-file dist/RELEASE-SUMMARY.txt \
            dist/panel-image-id.txt \
            dist/panel-image-commit.txt \
            dist/family-vpn-panel-image.tar \
            dist/family-vpn-panel-image.tar.sha256 \
            dist/family-vpn-install-*.tar.gz \
            dist/family-vpn-install-*.tar.gz.sha256 \
            dist/family-vpn-install-*.tar.gz.sig \
            dist/panel-install-boot-*.sh \
            dist/panel-install-boot-*.sh.sig \
            dist/IMAGE-INSTALL.txt \
            dist/family-vpn-panel-update-*.tar.gz \
            dist/family-vpn-panel-update-*.tar.gz.sha256 \
            dist/family-vpn-panel-update-*.tar.gz.sig \
            dist/panel-update-boot-*.sh \
            dist/PANEL-UPDATE.txt \
            dist/panel.sh \
            dist/panel.sh.sha256 \
            dist/panel.sh.sig \
            dist/wireguard.sh \
            dist/wireguard.sh.sha256 \
            dist/wireguard.sh.sig \
            dist/RELEASE-SUMMARY.txt \
            releases/family-vpn-agent-linux-amd64 \
            releases/install.sh \
            releases/install.sh.sig \
            releases/bootstrap.sh \
            releases/SHA256SUMS \
            releases/release-signing.pub \
            releases/INSTALL.txt
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/${tag}" >> "$GITHUB_ENV"
          echo "GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${tag}"

      - name: Install Docker inside a clean Ubuntu 24.04 and load the image
        run: bash scripts/run-clean-ubuntu-docker-test.sh
