name: panel-image

# Builds the production image inside the private repository.
# It does not push the image to a registry and does not publish a release.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Build the agent files used by the installer package
        env:
          FAMILY_VPN_PUBLIC_URL: https://panel.example.com
          VERSION: "0.4.0"
        run: bash scripts/build-release.sh

      - name: Build the production image
        run: bash scripts/build-panel-image.sh

      - name: Pack the minimal installer
        run: |
          digest=$(cat dist/panel-image-id.txt)
          bash scripts/build-image-install.sh --digest "$digest" --image-ref "$digest"

      - name: Upload the private image and installer
        uses: actions/upload-artifact@v4
        with:
          name: family-vpn-panel-image
          path: |
            dist/panel-image-id.txt
            dist/panel-image-commit.txt
            dist/family-vpn-panel-image.tar
            dist/family-vpn-panel-image.tar.sha256
            dist/family-vpn-install-*.tar.gz
            dist/family-vpn-install-*.tar.gz.sha256
            dist/IMAGE-INSTALL.txt
          if-no-files-found: error
