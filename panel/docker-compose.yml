# Panel stack for a public IP certificate issued by Certbot.
# The domain stack remains deploy/docker-compose.yml.
name: family-vpn

services:
  panel:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/family-vpn/panel.env
    volumes:
      - /var/lib/family-vpn/panel:/data
      - ../releases:/app/releases:ro
    expose:
      - "3000"
    networks:
      - family-vpn

  caddy:
    # Digest pinned for supply-chain integrity (FV-007). Bump deliberately after review.
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    # Root inside the container so the private key can stay mode 600 on the host.
    user: "0:0"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/family-vpn/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/family-vpn/certs:/certs:ro
      - /var/lib/family-vpn/acme:/acme:ro
      - ../releases:/srv/releases:ro
    depends_on:
      - panel
    networks:
      - family-vpn

networks:
  family-vpn:
